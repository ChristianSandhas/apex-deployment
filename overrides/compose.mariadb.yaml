# MariaDB-Variante (Produktions-Standard).
# Start:  docker compose -f compose.yaml -f overrides/compose.mariadb.yaml up -d

services:
  db:
    # mind. 10.7 noetig: Frappe legt UUID-Doctypes (z.B. APX Part)
    # mit nativem uuid-Spaltentyp an
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt (siehe example.env)}
    # DB von aussen erreichbar; DB_BIND=0.0.0.0 in .env setzen, um sie im
    # Netzwerk freizugeben (dann unbedingt Firewall auf vertrauenswuerdige IPs!)
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      interval: 1s
      retries: 20

  configurator:
    depends_on:
      db:
        condition: service_healthy
    command:
      - >
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;

  create-site:
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]];
        do
          echo "Warte auf common_site_config.json...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then echo "Timeout"; exit 1; fi
        done;
        [ -d "sites/${SITE_NAME}" ] && echo "Site existiert bereits" && exit 0;
        bench new-site ${SITE_NAME}
        --mariadb-user-host-login-scope='%'
        --admin-password=${ADMIN_PASSWORD}
        --db-root-password=${DB_PASSWORD}
        --install-app apex;

volumes:
  db-data:
